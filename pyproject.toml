[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rampr"
version = "0.1.0"
description = "Regional analysis and modeling for the perennial revolution"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  { name = "Sergio Rey" }
]
dependencies = [
  "platformdirs>=4",
  "pooch>=1.8",
  "numpy",
  "pandas",
  "openpyxl>3.1",
]

keywords = ["regional science", "input-output", "perennial grains", "economics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/sjsrey/rampr"
Issues = "https://github.com/sjsrey/rampr/issues"

[tool.setuptools.packages.find]
include = ["rampr*"]
exclude = ["data*", "tests*", "scripts*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
rampr = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
jupyterlab = ">=4.5.6,<5"
numpy = ">=2.4.3,<3"
seaborn = ">=0.13.2,<0.14"
pandas = ">=3.0.2,<4"
geopandas = ">=1.1.3,<2"
tobler = ">=0.13.0,<0.14"
